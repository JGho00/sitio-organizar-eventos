<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Interno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/excepciones.css">
</head>
<body>

    <div class="overlay"></div>

    <div class="error-modal">
        <div class="error-icon">⚠️</div>
        <h2 class="error-title">Hubo un problema</h2>
        <p class="error-msg">{{ mensaje }}</p>
        <p class="countdown">Serás redirigido automáticamente en <span id="timer">11</span> segundos...</p>
    </div>
    <script src="/static/js/excepciones.js"></script>
</body>
</html>
