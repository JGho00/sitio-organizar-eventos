<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
        Sistema Eventos
        {% endblock %}
    </title>

    <link rel="stylesheet" href="/static/css/styles.css">

    {% block styles %}
    {% endblock %}

</head>

<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <img src="/static/images/logo.png" class="logo">
                <a href="/" class ="titulo-header"><h1 class="site-title">Gestor de Eventos</h1></a>
            </div>
            <div class="header-right">
                <span class="user-info">
                    <span class="user-icon">👤</span>
                    <span class="user-name">Usuario: {{username}}</span>
                </span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <!-- MENÚ VERTICAL IZQUIERDO -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul class="nav-list">
                     <li class="nav-item">
                        <a href="/" class="nav-link active">
                            <span class="nav-icon">🏫</span>
                            <span class="nav-text">Inicio</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/escuelas" class="nav-link active">
                            <span class="nav-icon">🏫</span>
                            <span class="nav-text">Escuelas</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/egresados" class="nav-link">
                            <span class="nav-icon">👨‍🎓</span>
                            <span class="nav-text">Egresados</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#pagos" class="nav-link">
                            <span class="nav-icon">💰</span>
                            <span class="nav-text">Pagos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/eventos" class="nav-link">
                            <span class="nav-icon">📅</span>
                            <span class="nav-text">Eventos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/cuotas" class="nav-link">
                            <span class="nav-icon">📊</span>
                            <span class="nav-text">Cuotas</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/contratos" class="nav-link">
                            <span class="nav-icon">📋</span>
                            <span class="nav-text">Contratos</span>
                        </a>
                    </li>
                    <li class="nav-item nav-divider"></li>
                    <li class="nav-item">
                        <a href="/logout" class="nav-link logout">
                            <span class="nav-icon">🚪</span>
                            <span class="nav-text">Cerrar Sesión</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    {% block scripts %}
    {% endblock %}

</body>
