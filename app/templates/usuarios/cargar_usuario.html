{% extends "base.html" %}

{% block title %}
Usuarios
{% endblock %}

{% block page_title %}Agregar usuario{% endblock %}
{% block page_subtitle %}Alta de un nuevo usuario del sistema{% endblock %}

{% block styles %}
{% endblock %}

{% block content %}

<section class="panel">
    <div class="panel-head"><h2>Datos del usuario</h2></div>
    <form action="/users/agregar-usuario" method="post" class="form-grid" data-ajax data-redirect="/users">
        <div class="field">
            <label>Nombre de usuario</label>
            <input type="text" name="username" placeholder="Ingresar nombre">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="text" name="email" placeholder="Ingresar email">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" name="password_hash" placeholder="Ingresar password">
        </div>
        <div class="field">
            <label>Rol</label>
            <input type="text" name="rol" placeholder="Ingresar rol">
        </div>
        <div class="form-actions">
            <a href="/users"><button type="button" class="btn">Cancelar</button></a>
            <button type="submit" class="btn primary">Agregar</button>
        </div>
    </form>
</section>

{% endblock %}
