{% extends "base.html" %}

{% block title %}
usuarios
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="/static/css/usuarios.css">
{% endblock %}

{% block content %}

<div>
    <div>
        <h1>Agregar usuario</h1>
    </div>
    <div>
        <form action="/users/agregar-usuario" method="post">
            <input type="text" name="username" placeholder="Ingresar nombre">
            <input type="text" name="email" placeholder="Ingresar email">
            <input type="password" name="password_hash" placeholder="Ingresar password">
            <input type="text" name="rol" placeholder="Ingresar rol">
            <button type="submit">Agregar</button>
        </form>
        
        <div>

            <a href="/users"><button>Cancelar</button></a>

        </div>
    </div>
</div>

{% endblock %}
